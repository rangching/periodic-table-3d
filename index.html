<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D 週期表</title>
<style>
  :root {
    --bg1: #1b2440; --bg2: #090d1a; --panel: rgba(14, 20, 38, .72); --line: rgba(255,255,255,.12);
    --text: #e8ecf8; --muted: #8d98b8; --accent: #7cc4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--text);
    font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 30%, var(--bg1), var(--bg2) 75%); }
  canvas#gl { position: fixed; inset: 0; display: block; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(10px); padding: 14px 16px; }
  #info { left: 16px; top: 16px; width: 330px; max-height: calc(100% - 32px); overflow: auto; }
  #ctrl { right: 16px; top: 16px; width: 300px; }
  h1 { margin: 0 0 4px; font-size: 26px; line-height: 1.1; letter-spacing: .04em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .card { display: flex; gap: 12px; align-items: center; margin: 10px 0; }
  .sym { width: 74px; height: 74px; border-radius: 12px; display: grid; place-items: center;
    font-size: 34px; font-weight: 700; color: #0b1020; position: relative; }
  .sym small { position: absolute; left: 6px; top: 4px; font-size: 12px; font-weight: 600; }
  .name { font-size: 22px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .stat { background: rgba(255,255,255,.05); border-radius: 8px; padding: 6px 8px; }
  .stat b { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
  .stat span { font-size: 15px; font-variant-numeric: tabular-nums; }
  #desc { font-size: 13px; line-height: 1.65; color: #c9d1ea; margin: 8px 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; }
  .lbl { font-size: 11px; letter-spacing: .12em; color: var(--muted); margin: 12px 0 6px; }
  .lbl:first-child { margin-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; font-size: 13px; color: var(--text); background: rgba(255,255,255,.07);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.14); }
  button.on { background: var(--accent); color: #07101f; border-color: transparent; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .eltrow { display: flex; gap: 8px; align-items: center; }
  .eltrow output { min-width: 62px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  #tempbox { display: none; }
  #tip { position: fixed; pointer-events: none; padding: 6px 10px; border-radius: 8px; font-size: 12px;
    background: rgba(8,12,24,.92); border: 1px solid var(--line); display: none; white-space: nowrap; }
  #hint { position: fixed; left: 16px; bottom: 14px; font-size: 12px; color: var(--muted); }
  @media (max-width: 820px) {
    .panel { padding: 10px 12px; border-radius: 12px; }
    #info { left: 8px; right: 8px; width: auto; top: auto; bottom: 8px; max-height: 34%; }
    #info h1, #info .sub, #info .legend { display: none; }
    #desc { font-size: 12px; line-height: 1.5; margin: 6px 0 0; max-height: 4.5em; overflow: auto; }
    .card { margin: 0; gap: 10px; }
    .sym { width: 52px; height: 52px; font-size: 24px; }
    .name { font-size: 18px; }
    .stats { margin: 6px 0; gap: 6px; }
    .stat { padding: 4px 6px; }
    .stat span { font-size: 13px; }
    #ctrl { left: 8px; right: 8px; width: auto; top: 8px; }
    .lbl { margin: 8px 0 4px; }
    #propBtns { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
    #propBtns button { white-space: nowrap; }
    #hint { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="info" class="panel">
  <h1>3D <span>週期表</span></h1>
  <div class="sub">每一欄的高度，就是你挑選的屬性。點選元素，可以走進它的原子。</div>
  <div class="card">
    <div class="sym" id="symBox"><small id="zNum">10</small><span id="symTxt">Ne</span></div>
    <div><div class="name" id="nameTxt">氖</div><div class="meta" id="metaTxt"></div></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="statLbl">游離能</b><span id="statVal">—</span></div>
    <div class="stat"><b>排名</b><span id="rankVal">—</span></div>
    <div class="stat"><b>原子量</b><span id="massVal">—</span></div>
  </div>
  <div id="desc"></div>
  <div id="atomStats" class="stats" style="display:none">
    <div class="stat"><b>質子</b><span id="pVal"></span></div>
    <div class="stat"><b>中子</b><span id="nVal"></span></div>
    <div class="stat"><b>價電子</b><span id="vVal"></span></div>
  </div>
  <div class="legend" id="legend"></div>
</div>

<div id="ctrl" class="panel">
  <div class="lbl">柱高屬性</div>
  <div class="row" id="propBtns"></div>
  <div class="lbl">元素</div>
  <div class="eltrow">
    <button id="prev">‹</button>
    <input id="zSlider" type="range" min="1" max="104" value="10" />
    <button id="next">›</button>
    <output id="zOut">10 Ne</output>
  </div>
  <div class="lbl">檢視</div>
  <div class="row" id="viewBtns">
    <button data-v="table" class="on">週期表</button>
    <button data-v="atom">原子</button>
    <button data-v="sample">樣品</button>
  </div>
  <div id="tempbox">
    <div class="lbl">溫度</div>
    <div class="eltrow"><input id="temp" type="range" min="0" max="5000" value="298" /><output id="tempOut">298 K</output></div>
    <div class="meta" id="phase" style="margin-top:4px"></div>
  </div>
</div>

<div id="tip"></div>
<div id="hint">拖曳旋轉・滾輪縮放・點選元素・←/→ 切換元素・1/2/3 切換檢視・Esc 回週期表</div>
<script type="module" src="./main.js"></script>
</body>
</html>
